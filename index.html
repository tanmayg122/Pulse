:root{--ink:#1A1023;--cream:#FFFDF8;--pur:#A544F2;--pur2:#6416B4;--pl:#F1E2FF;--red:#FF4B2B;--yel:#F4FF3A;--pink:#FFC2E5;--blue:#8EC0FF;--mint:#BFF3D5;--green:#1E5631;--green2:#2E8B57;--gl:#E3F4E8;--org:#FF9A3C;--amb:#FFC24B;--mut:#6B5F70;--cy:#22F0FF;--mag:#FF3DCB;--nite:#0E0A14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#141118;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:var(--s,20px);height:var(--s,20px);fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.work{display:grid;grid-template-columns:240px 410px 280px;gap:34px;justify-content:center;padding:26px;min-height:100vh}
.side{color:#d9d0de;font-size:13px}
.side h1{font-family:Anton;font-size:44px;letter-spacing:.5px;margin:0;color:#fff;line-height:1}
.side h1 span{color:var(--yel)}
.side .sub{color:#a99eb1;font-size:12px;line-height:1.5;margin:6px 0 14px}
.side .grp{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8e8297;font-weight:800;margin:14px 0 5px}
.side .nav{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:9px;color:#d9d0de;font-weight:600;font-size:12.5px}
.side .nav:hover{background:#271f2d}.side .nav.on{background:#3a2549;color:#fff}
.sticky{position:sticky;top:26px}
.ctrl{display:flex;gap:8px;margin-top:6px}
.ctrl button{flex:1;background:#271f2d;border:1px solid #3d3245;color:#e8e0ec;border-radius:10px;padding:9px;font-weight:700;font-size:12px;display:flex;gap:6px;align-items:center;justify-content:center}
.note{background:#211b26;border:1px solid #382d40;border-radius:14px;padding:14px;margin-top:14px;font-size:12.5px;line-height:1.55;color:#cfc5d5}
.note b{color:#fff}
.phone{width:410px;height:868px;border-radius:56px;background:#08070a;padding:10px;box-shadow:0 30px 90px #000a, inset 0 0 0 2px #3b3742;position:relative}
.scr{width:100%;height:100%;border-radius:46px;overflow:hidden;position:relative;background:var(--cream);transition:filter .4s}
body.calm .scr{filter:saturate(.42) contrast(.96)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:31px;background:#000;border-radius:20px;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;font-weight:800;font-size:14px;z-index:55;pointer-events:none}
.status.light{color:#fff}
.vp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.vp::-webkit-scrollbar{display:none}
.vp>div{min-height:100%;display:flex;flex-direction:column}.vp>div>.pg{flex:1}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:5px;background:var(--ink);z-index:70;pointer-events:none}
.pg{min-height:100%;padding-bottom:40px}
.pg.mainp{padding-bottom:130px}
.enter{animation:fadeup .35s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.enterb{animation:fadeup .35s cubic-bezier(.2,.8,.2,1)}
@keyframes enterb{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.enterf{animation:fadeup .4s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeup{from{opacity:0;transform:translateY(16px) scale(.99)}}
.pad{padding-left:20px;padding-right:20px}
.dots{background-image:radial-gradient(#0000001f 1.5px,transparent 1.6px);background-size:16px 16px}
.dotsw{background-image:radial-gradient(#ffffff30 1.5px,transparent 1.6px);background-size:16px 16px}
.cyber{background-image:radial-gradient(#22F0FF40 1.4px,transparent 1.6px),linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:16px 16px,32px 32px,32px 32px}
.scanl::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff0c 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
.blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;pointer-events:none}
.hero{position:relative;overflow:hidden}
.doodle{position:absolute;pointer-events:none;stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round}
.disp{font-family:Anton,Impact,sans-serif;text-transform:uppercase;line-height:.92;letter-spacing:.3px}
.sh{text-shadow:3px 3px 0 var(--ink)}
.glitch{animation:glitch .5s steps(2) 1}
@keyframes glitch{0%{text-shadow:3px 0 var(--cy),-3px 0 var(--mag),3px 3px 0 var(--ink);transform:translateX(2px)}40%{text-shadow:-3px 0 var(--cy),3px 0 var(--mag),3px 3px 0 var(--ink);transform:translateX(-2px)}100%{transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:58px;margin-bottom:12px;position:relative;z-index:3}
.ava{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:Anton;font-size:19px;border:2px solid var(--ink);flex:none}
.icb{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--ink);border:2px solid var(--ink);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);flex:none}
.guideb{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);overflow:hidden;position:relative;flex:none;background:#fff}
.guideb img{width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scale(1.7);transform-origin:50% 12%}
.guideb.k{background:var(--gl)}.guideb.a{background:var(--pl)}
.guideb .ping{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid #fff;animation:ping 1.6s infinite}
@keyframes wob{from{transform:rotate(-5deg) scale(.96)}to{transform:rotate(5deg) scale(1.04)}}
@keyframes itch{from{transform:translateY(-14px) rotate(-4deg)}to{transform:translateY(14px) rotate(4deg)}}
@keyframes ping{50%{transform:scale(1.25)}}
.icb:active,.btn:active,.card.tap:active,.chip:active,.guideb:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.card{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:16px;position:relative}
.card.fold::after{content:'';position:absolute;top:-2px;right:-2px;width:26px;height:26px;border-top-right-radius:18px;background:linear-gradient(225deg,var(--cream) 0 45%,var(--ink) 45% 52%,rgba(255,255,255,.6) 52%)}
.card.tap{transition:transform .1s,box-shadow .1s;cursor:pointer;width:100%;text-align:left;display:block}
.btn{color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 16px;border-radius:16px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--yel);font-weight:800;font-size:15px;transition:transform .1s,box-shadow .1s}
.btn.g{background:var(--green);color:#fff}.btn.w{background:#fff}.btn.p{background:var(--pur);color:#fff}.btn.k{background:var(--ink);color:#fff}.btn.neo{background:var(--yel);color:var(--ink)}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chip{color:var(--ink);display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--ink);transition:transform .1s}
.chip.on{background:var(--ink);color:#fff}
.chip.g.on{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.lab{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
.sec{display:flex;justify-content:space-between;align-items:flex-end;margin:24px 0 11px}
.sec .disp{font-size:26px}
.sec button{font-weight:800;font-size:13px;color:var(--pur2);text-decoration:underline}
.mut{color:var(--mut)}.small{font-size:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;border:1.5px solid var(--ink);background:var(--yel);color:var(--ink)}
.tag.g{background:var(--mint)}.tag.o{background:#FFD9B8}.tag.p{background:var(--pl)}.tag.c{background:var(--cy)}
.row{display:flex;align-items:center;gap:12px}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tile{width:52px;height:52px;border-radius:14px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:26px;flex:none;color:var(--ink)}
.list{display:grid;gap:10px}
.li{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:11px 12px;box-shadow:3px 3px 0 var(--ink);width:100%;text-align:left;transition:transform .1s,opacity .25s}
.li b{display:block;font-size:15px}.li small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.li>span:not(.tile):not(.end){flex:1;min-width:0}
.li .end{margin-left:auto;text-align:right;font-weight:800;font-size:13px;white-space:nowrap;flex:none}
.li .end .chip{padding:6px 10px;font-size:12px}
.bar{height:14px;border-radius:9px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.bar>div{height:100%;background:var(--green);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.char{position:absolute;pointer-events:none;filter:drop-shadow(3px 3px 0 rgba(26,16,35,.25))}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.stag>*{animation:up .4s both cubic-bezier(.2,.8,.2,1)}
.stag>*:nth-child(2){animation-delay:.04s}.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.12s}.stag>*:nth-child(5){animation-delay:.16s}.stag>*:nth-child(6){animation-delay:.2s}.stag>*:nth-child(n+7){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
#tabs{position:absolute;inset:0;z-index:40;pointer-events:none}
#tabs>*{pointer-events:auto}
.tabs{position:absolute;left:12px;right:12px;bottom:20px;height:70px;background:#fff;border:2px solid var(--ink);border-radius:24px;box-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;justify-content:space-around;padding:0 6px;animation:up .3s}
.tabs.dark{background:#2A2236;border-color:#0b0810;box-shadow:4px 4px 0 #0b0810;color:#fff}
.tabs button{display:grid;place-items:center;gap:2px;font-size:10.5px;font-weight:800;color:#8a7f90;width:60px}
.tabs.dark button{color:#9b8fb0}
.tabs button.on{color:var(--green)}
.tabs.dark button.on{color:var(--yel)}
.tabs button.on svg{transform:scale(1.12)}
.tabs .add{width:62px;height:62px;border-radius:20px;background:var(--yel);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);color:var(--ink);margin-top:-32px;transition:transform .2s}
.tabs .add.open{transform:rotate(45deg)}
.fan{position:absolute;bottom:104px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:41}
.fan button{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;animation:fan .3s cubic-bezier(.3,1.5,.5,1) both;position:relative}
.fan button span{position:absolute;top:62px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:0 1px 3px #000}
@keyframes fan{from{transform:translateY(40px) scale(.3);opacity:0}}
.fanshade{position:absolute;inset:0;background:#1a1023aa;z-index:39;animation:fade .2s;backdrop-filter:blur(2px)}
.shade{position:absolute;inset:0;background:#1a102399;z-index:80;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--cream);border-top:3px solid var(--ink);border-radius:28px 28px 0 0;padding:10px 20px 40px;animation:sheet .34s cubic-bezier(.2,.9,.2,1);scrollbar-width:none}
@keyframes sheet{from{transform:translateY(100%)}}
.grab{width:46px;height:5px;border-radius:5px;background:#cfc4d4;margin:0 auto 14px}
.center{align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--cream);border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:22px;width:100%;animation:pop .35s cubic-bezier(.3,1.5,.5,1);position:relative;max-height:90%;overflow:auto}
.xclose{position:absolute;top:12px;right:12px}
.toast{position:absolute;left:16px;right:16px;bottom:104px;z-index:90;background:var(--ink);color:#fff;border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px;animation:toast .35s cubic-bezier(.3,1.4,.5,1);box-shadow:0 10px 30px #0005}
.toast{pointer-events:none}.toast button{pointer-events:auto}
.toast.hi{bottom:auto;top:58px}
@keyframes toast{from{transform:translateY(30px);opacity:0}}
.toast button{margin-left:auto;color:var(--yel);font-weight:800;display:flex;gap:5px;align-items:center}
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(var(--ink) 0 6px,transparent 6px 11px)}
.tl .li{position:relative}
.tl .li::before{content:'';position:absolute;left:-19px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translateY(-50%)}
.li.gap{background:transparent;border-style:dashed;box-shadow:none}
.li.skip{opacity:.7;background:#f3eef5}
.li.guess{background:repeating-linear-gradient(-45deg,#fff 0 10px,#FFF9C9 10px 20px)}
.gauge{position:relative;width:250px;height:140px;margin:0 auto}
.needle{position:absolute;left:50%;bottom:6px;width:6px;height:96px;margin-left:-3px;transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border:2px solid var(--ink);border-radius:16px;background:#fff;font-weight:700;font-size:15px;box-shadow:3px 3px 0 var(--ink);transition:background .15s,transform .1s}
.opt small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:2px}
.opt.on{background:var(--pl)}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);flex:none;display:grid;place-items:center;background:#fff}
.opt.on .rad::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--pur2);animation:pop .25s}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);flex:none;display:grid;place-items:center;background:#fff}
.opt.on .chk{background:var(--pur2);color:#fff}
.field{width:100%;border:2px solid var(--ink);border-radius:14px;padding:13px;background:#fff;outline:none;font-size:15px;resize:none;color:var(--ink)}
.field:focus{box-shadow:3px 3px 0 var(--pur)}
.step{display:flex;align-items:center;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;flex:none;color:var(--ink)}
.step button{width:32px;height:34px;font-weight:800;font-size:17px}
.step span{min-width:34px;text-align:center;font-weight:800;font-size:13px}
.prog{display:flex;gap:5px;margin:4px 0 14px}
.prog i{flex:1;height:6px;border-radius:6px;background:#0000001f;transition:background .3s}
.prog i.on{background:var(--ink)}
.conf{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;border:1.5px solid var(--ink)}
.conf.sure{background:var(--mint)}.conf.fair{background:#FFE7A6}.conf.rough{background:#FFD0B5}
.dotc{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.bubble{background:#fff;border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:11px 13px;font-size:14px;line-height:1.45;max-width:82%;box-shadow:2px 2px 0 var(--ink);animation:up .3s;color:var(--ink)}
.bubble.me{margin-left:auto;background:var(--pur);color:#fff;border-radius:18px 18px 4px 18px}
.bubble.k{background:var(--gl)}
.why{margin-top:8px;font-size:12px;color:var(--mut);border-top:1px dashed #0003;padding-top:7px}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin:0 2px;animation:bob .8s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.cam{position:absolute;inset:0;background:#0d0b10;color:#fff}
.vf{position:absolute;left:18px;right:18px;top:110px;height:420px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#5b4a3a,#1b1612 70%)}
.vf img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf .corner{position:absolute;width:40px;height:40px;border:4px solid var(--yel);z-index:2}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--yel);box-shadow:0 0 18px var(--yel);animation:scan 1.4s ease-in-out infinite alternate;z-index:2}
@keyframes scan{from{top:8%}to{top:90%}}
.flash{position:absolute;inset:0;background:#fff;z-index:99;animation:flash .35s forwards;pointer-events:none}
@keyframes flash{to{opacity:0}}
.shutter{width:80px;height:80px;border-radius:50%;border:5px solid #fff;background:#fff3;display:grid;place-items:center}
.shutter i{width:60px;height:60px;border-radius:50%;background:#fff;display:block;transition:transform .1s}
.shutter:active i{transform:scale(.85)}
.wave{display:flex;gap:4px;align-items:center;height:60px;justify-content:center}
.wave i{width:6px;border-radius:4px;background:#fff;height:10px}
.wave.on i{animation:wv .7s ease-in-out infinite alternate}
@keyframes wv{to{height:var(--h)}}
.mic{width:120px;height:120px;border-radius:50%;background:var(--yel);color:var(--ink);display:grid;place-items:center;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);margin:0 auto;transition:transform .15s;position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.mic.on{transform:scale(1.08);background:var(--red);color:#fff}
.mic.on::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--red);animation:ring 1s infinite}
@keyframes ring{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.3)}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(900px) rotate(720deg)}}
.wipe{position:absolute;inset:0;z-index:85;pointer-events:none;background-image:radial-gradient(var(--c,#A544F2) 2.4px,transparent 2.6px);background-size:14px 14px;animation:wipe .55s cubic-bezier(.6,0,.3,1) forwards}
@keyframes wipe{0%{clip-path:circle(0% at var(--x,50%) var(--y,95%));opacity:1}60%{clip-path:circle(150% at var(--x,50%) var(--y,95%));opacity:1}100%{clip-path:circle(150% at var(--x,50%) var(--y,95%));opacity:0}}
.grid7{display:grid;grid-template-columns:40px repeat(4,1fr);gap:5px;font-size:11px}
.grid7 .c{border:1.5px solid var(--ink);border-radius:9px;padding:6px 5px;background:#fff;min-height:44px;line-height:1.25;font-weight:600;text-align:left}
.grid7 .c.uns{border-style:dashed;border-color:var(--org);background:#FFF1E2}
.grid7 .h{font-weight:800;text-align:center;align-self:center}
.ring{transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.slide{position:relative;height:58px;border-radius:16px;border:2px solid var(--ink);background:var(--green);color:#fff;overflow:hidden;box-shadow:3px 3px 0 var(--ink);touch-action:none;user-select:none}
.slide .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;padding-left:40px;letter-spacing:.3px}
.slide .lbl em{font-style:normal;background:linear-gradient(90deg,#fff6,#fff,#fff6);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.slide .knob{position:absolute;left:4px;top:4px;width:50px;height:46px;border-radius:12px;background:var(--yel);color:var(--ink);display:grid;place-items:center;border:2px solid var(--ink)}
.launcher{position:absolute;inset:0;background:linear-gradient(160deg,#5b1fa3,#2a0f4d 45%,#1E5631);color:#fff;padding:60px 16px 20px;overflow:auto}
.wd{background:#ffffffee;color:var(--ink);border-radius:24px;padding:14px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.appico{display:grid;place-items:center;gap:5px;font-size:11px;font-weight:600}
.appico span{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:#ffffff26;overflow:hidden}
.notif{background:#ffffffee;color:var(--ink);border-radius:20px;padding:12px;margin-top:10px;animation:up .4s}
.watch{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#2d1747,#0c0711 70%);border:10px solid #2a2530;box-shadow:0 0 0 3px #4a4352,0 20px 50px #0008;margin:10px auto;display:grid;place-items:center;text-align:center;color:#fff;position:relative;overflow:hidden;cursor:pointer;user-select:none}
/* dark workout panel */
.dk{background:#1C1626;color:#fff}
.dk .card{background:#2A2236;border-color:#0b0810;box-shadow:4px 4px 0 #0b0810;color:#fff}
.dk .li{background:#2A2236;border-color:#0b0810;box-shadow:3px 3px 0 #0b0810;color:#fff}
.dk .li small,.dk .mut{color:#b7abc8}
.dk .tile{background:#EDE6FB;color:var(--ink);border-color:#0b0810}
.dk .lab{color:#9b8fb0}
.dk .chip{background:#1b1424;color:#fff;border-color:#5b4a77;box-shadow:none}
.dk .chip.on{background:var(--yel);color:var(--ink);border-color:var(--yel)}
.dk .btn.w{background:#1b1424;color:#fff;border-color:#5b4a77;box-shadow:3px 3px 0 #000}
.dk .icb{background:#2A2236;color:#fff;border-color:#0b0810;box-shadow:2px 2px 0 #0b0810}
.dk .sec button{color:var(--yel)}
.neon{color:var(--yel)}
.fig{width:100%;height:170px}
.fig .st{stroke:#EDE6F2;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;fill:none;paint-order:stroke;filter:drop-shadow(0 0 0 #000) drop-shadow(1.5px 0 0 #1A1023) drop-shadow(-1.5px 0 0 #1A1023) drop-shadow(0 1.5px 0 #1A1023) drop-shadow(0 -1.5px 0 #1A1023)}
.fig .hd{fill:#EDE6F2;stroke:#1A1023;stroke-width:3}
.fig .eq{stroke:#8a8494;stroke-width:8;stroke-linecap:round}
.fig .fl{stroke:#ffffff40;stroke-width:3}
@keyframes up1{50%{transform:translateY(-22px)}}
@keyframes rot1{50%{transform:rotate(-70deg)}}
@keyframes rot2{50%{transform:rotate(70deg)}}
@keyframes pushb{50%{transform:rotate(-9deg)}}
.a-up{animation:up1 1.8s ease-in-out infinite}
.a-push{transform-origin:240px 140px;animation:pushb 1.8s ease-in-out infinite}
/* coach marks */
.coach{position:absolute;inset:0;z-index:120}
.coach .hole{position:absolute;border-radius:20px;box-shadow:0 0 0 2000px #0e0a14d9;border:3px solid var(--cy);transition:all .4s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.coach .tip{position:absolute;left:18px;right:18px;background:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--cy);padding:16px;transition:top .4s;animation:pop .35s}
@media(max-width:1100px){.work{grid-template-columns:410px 280px}.side.left{display:none}}
@media(max-width:760px){
 body{background:var(--cream)}
 .work{display:block;padding:0}
 .side{display:none}
 .phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}
 .scr{border-radius:0}.island,.homebar{display:none}
 .mobnav{display:flex!important}
 .status{display:none}
 .top{padding-top:calc(env(safe-area-inset-top) + 18px)}
}
.tr{position:absolute;inset:0;z-index:150;display:grid;grid-template-columns:repeat(9,1fr);grid-auto-rows:calc(100% / 20);pointer-events:none;overflow:hidden}
.tr i{display:block;width:100%;height:100%;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .2s cubic-bezier(.5,0,.4,1);transition-delay:var(--d)}
.tr.in i{transform:scale(1.62)}.tr.out i{transform:scale(0);transition-delay:var(--o)}
.tr i:nth-child(7n+3){background:#2a1838}
.card,.opt{isolation:isolate}
.card::before,.opt.on::before{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background-image:radial-gradient(#1A1023 1.9px,transparent 2.2px);background-size:9px 9px;-webkit-mask-image:linear-gradient(225deg,#000 0,transparent 42%);mask-image:linear-gradient(225deg,#000 0,transparent 42%);opacity:.22}
.opt.on::before{opacity:.3;-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000);mask-image:linear-gradient(90deg,transparent 40%,#000)}
.dk .card::before{background-image:radial-gradient(#ffffff 1.6px,transparent 2px);opacity:.12}
.ht{position:absolute;pointer-events:none;background-image:radial-gradient(#1A1023 3.2px,transparent 3.6px);background-size:14px 14px;opacity:.5}
.ht.a{-webkit-mask-image:radial-gradient(circle at 100% 0,#000,transparent 70%);mask-image:radial-gradient(circle at 100% 0,#000,transparent 70%)}
.ht.b{-webkit-mask-image:radial-gradient(circle at 0 100%,#000,transparent 70%);mask-image:radial-gradient(circle at 0 100%,#000,transparent 70%)}
.ht.w{background-image:radial-gradient(#ffffff 3px,transparent 3.4px);opacity:.25}
.ht.c{background-image:radial-gradient(#22F0FF 2.6px,transparent 3px);opacity:.35}
.photo{width:100%;border-radius:16px;border:2px solid var(--ink);display:block}
.mobnav{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom) + 100px);left:6px;z-index:200;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;align-items:center;justify-content:center;opacity:.55;font-size:15px}
.mobmenu{position:fixed;inset:0;background:#141118f5;z-index:300;overflow:auto;padding:20px 20px 60px;color:#fff;animation:fade .2s}
.mobmenu .side{display:block}
</style>

 <div style="display:grid;gap:12px;margin:18px 0">${log.map(([q,a])=>`<div class="bubble me">${esc(q)}</div>${a?say(w,esc(a[0]),'Why: '+esc(a[1]))+(a[2]?`<button class="chip pop" style="justify-self:start;margin-left:54px" onclick="sfx('log');toast('Done: ${esc(a[2]).replace(/'/g,'')}')">${I('sparkles',14)}${esc(a[2])}</button>`:''):`<div class="bubble ${k?'k':''} typing"><i></i><i></i><i></i></div>`}`).join('')}</div>
 <div class="chips">${Object.keys(Q).filter(q=>!log.find(l=>l[0]===q)).map(q=>`<button class="chip" onclick="ask('${w}','${q}')">${q}</button>`).join('')}</div>
 <div class="row" style="margin-top:14px"><input class="field" id="cin" placeholder="Ask about your day" onkeydown="if(event.key==='Enter')ask('${w}',this.value)"><button class="icb" style="background:var(--yel);color:var(--ink)" onclick="ask('${w}',$('#cin').value)">${I('send',18)}</button></div>
 ${k?'':`<button class="btn w" style="margin-top:14px" onclick="shareDay()">${I('share-2')}Share today with my trainer</button>`}</div></div>`}
async function ask(w,q){q=(q||'').trim();if(!q)return;const log=w==='k'?S.chatK:S.chatA,Q=w==='k'?KQ:AQ;const entry=[q,null];log.push(entry);sfx('tap');render();scrollEnd();
 let a=Q[q];if(!a||aiMode()!=='Demo'){const t=dayTotals();const persona=w==='k'?'You are Kabir, a friendly Indian nutrition guide in a food tracking app. Answer in 2 to 3 short plain sentences, Indian food context, household units. Supplements: information only. Never diagnose.':'You are Arjun, a calm Indian fitness coach in a training app. Answer in 2 to 3 short plain sentences. Practical, no hype.';
 const ctx=`User context: ${S.diet}, lifestyle ${lifeL()}, today eaten ${t.lo} to ${t.hi} kcal, protein ${t.p} of ${S.ptarget} g, session today push day ${S.time} min, slept 5h50m, steps 8420. Mess today: ${S.week.Mon.join(' | ')}.`;
 const txt=await ai(`${persona}\n${ctx}\nReturn ONLY JSON {"answer":"...","why":"what data you used, short","action":"short button label or empty"}\nQuestion: ${q}`);const j=parseJSON(txt);if(j&&j.answer)a=[j.answer,j.why||'Your log',j.action||''];else if(txt)a=[txt.slice(0,400),'Your log',''];}
 await new Promise(r=>setTimeout(r,500));entry[1]=a||[w==='k'?'From your log, protein is the main gap today, so start there. Curd or dal at dinner is the easiest fix.':'Keep the session and drop one set if you feel heavy. Consistency beats one perfect day.','Your log for this week (demo answer, add AI in Settings)','Add to today'];sfx('log');render();scrollEnd()}
function scrollEnd(){setTimeout(()=>{const v=$('#vp');v.scrollTo({top:v.scrollHeight,behavior:'smooth'})},60)}
function shareDay(){const t=dayTotals();const msg=`Today: ${t.lo} to ${t.hi} kcal, ${t.p} g protein. Push day ${S.sessionDone?'done':'planned'}, ${S.time} min. Shared from ${APP}.`;if(navigator.share)navigator.share({text:msg}).catch(()=>{});else{window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')}toast('Day summary ready to share')}
function gaps(){return `<div class="pg">${hdr('Likely low')}<div class="pad">${say('k','From 26 logged days. Treat these as hints, not a test result.')}<div class="list stag" style="margin-top:16px">${[['Iron','35%','Rajma, chana, palak, jaggery','🩸'],['Vitamin B12','25%','Curd, milk, eggs, paneer','🥛'],['Calcium','55%','Curd, milk, ragi, til','🦴']].map(([n,p,f,e])=>`<div class="card"><div class="sp"><b style="font-size:17px">${e} ${n}</b><span class="tag o">Likely low</span></div><div class="small mut" style="margin:6px 0">About ${p} of what you need, on logged days</div><div class="bar"><div style="width:${p};background:var(--org)"></div></div><div class="small" style="margin-top:8px"><b>From your mess:</b> ${f}</div></div>`).join('')}</div><div class="card" style="margin-top:14px;background:#FFF1E2">${I('circle-help',18)} <b>Feeling tired often?</b> Check with a doctor. This is not a diagnosis.</div></div></div>`}
function budget(){const opts=[['Extra katori of rajma','At the mess counter',0,9],['Curd, 1 katori','Mess counter',20,8],['Roasted chana, 50 g','Canteen',15,10],['2 boiled eggs','Canteen',24,12],['Milk, 1 glass','Mess',25,8],['Paneer, 50 g','Shop near gate',35,9]].filter(o=>o[2]<=S.budget&&(o[0]!=='2 boiled eggs'||S.diet!=='Veg'));let p=0,c=0;const best=opts.filter(o=>{if(c+o[2]<=S.budget&&p<48){c+=o[2];p+=o[3];return true}return false});
 return `<div class="pg">${hdr('Within budget')}<div class="pad"><div class="card" style="background:var(--yel)"><div class="sp"><span><div class="lab">Protein left</div><div class="disp" style="font-size:40px">${Math.max(0,S.ptarget-dayTotals().p)} g</div></span><span style="text-align:right"><div class="lab">Daily budget</div><div class="disp" style="font-size:40px">₹${S.budget}</div></span></div><input type="range" min="0" max="100" step="10" value="${S.budget}" style="width:100%;accent-color:#1E5631;margin-top:8px" oninput="S.budget=+this.value;render()"></div>
 <div class="lab" style="margin:18px 0 8px">Near you, under ₹${S.budget}</div><div class="list">${opts.map(([n,w,pr,pp])=>`<div class="li"><span class="tile">${pr?'🥣':'🫘'}</span><span><b>${n}</b><small>${w} · +${pp} g protein</small></span><span class="end">${pr?'₹'+pr:'Free'}</span></div>`).join('')}</div><div style="height:14px"></div>
 ${say('k',`Best mix: ${best.map(b=>b[0].toLowerCase()).join(', ')||'the free extra katori'}. That is +${p} g for ₹${c}.`,'Why: cheapest protein per rupee from places you eat at')}</div></div>`}
function katori(){return `<div class="pg">${hdr('Your katori size')}<div class="pad"><div class="disp" style="font-size:40px;margin-bottom:10px">"1 katori" should mean your katori</div>${say('k','Snap your katori, roti and glass next to your hand once. After that every unit means your size in grams.')}<img class="photo" src="${IMG.p_katori}" style="margin-top:14px;height:220px;object-fit:cover">
 ${S.katori?`<div class="card pop" style="margin-top:16px;background:var(--mint)"><div class="lab" style="color:var(--green)">Your sizes</div>${[['Katori','180 ml','Mess steel katori'],['Roti','35 g','Thin, 15 cm'],['Glass','250 ml','Steel glass']].map(([a,b,c])=>`<div class="sp" style="padding:9px 0;border-top:1.5px dashed #0002"><span><b>${a}</b><small class="mut" style="display:block">${c}</small></span><span class="disp" style="font-size:26px">${b}</span></div>`).join('')}</div><button class="btn w" style="margin-top:14px" onclick="go('camera',{camMode:'katori',photo:null})">Measure again</button>`:`<button class="btn" style="margin-top:20px" onclick="go('camera',{camMode:'katori',photo:null})">${I('camera')}Snap my katori</button>`}</div></div>`}
function cook(){const msg='Tomorrow for Tanmay: 1 extra katori of dal at lunch, and curd at dinner. Thank you!';return `<div class="pg">${hdr('Tell the person who cooks')}<div class="pad">${say('k','Send one small change for tomorrow. No app needed on their side.')}
 <div class="lab" style="margin:18px 0 8px">Who cooks? Pick one</div><div class="chips">${['Mom','Cook','Tiffin service','Mess manager','Myself'].map(x=>`<button class="chip g ${S.cook===x?'on':''}" onclick="S.cook='${x}';sfx('tick');render()">${x}</button>`).join('')}</div>
 <div class="card" style="margin-top:16px;background:#DCF8C6"><div class="lab">WhatsApp preview</div><p style="font-size:16px;line-height:1.45;margin:8px 0 0">${msg}</p></div>
 <button class="btn g" style="margin-top:16px" onclick="S.cookSent=true;window.open('https://wa.me/?text='+encodeURIComponent('${msg}'),'_blank');toast('Opened WhatsApp')">${I('send')}Send on WhatsApp</button></div></div>`}
function diary(){const days=[['Thu','29','logged'],['Fri','30','half'],['Sat','31','paused'],['Sun','1','logged'],['Mon','2','today']],d=days[S.diaryDay]||days[4];
 return `<div class="pg">${hdr('Diary')}<div class="pad"><div class="sp" style="margin-bottom:12px">${days.map(([w,n,st],i)=>`<button onclick="S.diaryDay=${i};sfx('tick');render()" style="display:grid;place-items:center;gap:4px;font-weight:800;font-size:12px"><span>${w}</span><span style="width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px ${st==='paused'?'dashed':'solid'} var(--ink);background:${S.diaryDay===i?'var(--ink)':st==='logged'||st==='today'?'var(--mint)':st==='half'?'linear-gradient(90deg,var(--mint) 50%,#fff 50%)':'#fff'};color:${S.diaryDay===i?'#fff':'inherit'}">${n}</span></button>`).join('')}</div>
 <div class="small mut" style="margin-bottom:12px">Full · half · dashed means paused. Gaps are kept apart, never counted as zero.</div>
 ${S.diaryDay===4?`<button class="btn w" onclick="tab('today',12)">See today</button>`:S.diaryDay===2?`<div class="card" style="text-align:center;padding:26px"><div style="font-size:40px">🚆</div><b>Paused, travel day home</b><p class="small mut">Nothing is expected on paused days.</p></div>`:`<div class="disp" style="font-size:30px;margin:6px 0 12px">${d[0]} ${d[1]}</div><div class="list">${[['Breakfast','Poha, chai','logged'],['Lunch','Dal, rice, roti','logged'],['Snacks',S.diaryDay===1?'':'Maggi, 1 packet',S.diaryDay===1?'gap':'logged'],['Dinner',S.diaryDay===1?'':'Paneer, roti',S.diaryDay===1?'skip':'logged']].map(([s,f,st])=>st==='gap'?`<div class="li gap"><span><b>${s}</b><small>Not logged. A gap, not a missed meal</small></span><button class="end chip on" onclick="openAdd('${s}')">${I('plus',14)}Fill</button></div>`:st==='skip'?`<div class="li skip"><span><b>${s}</b><small>Skipped on purpose</small></span></div>`:`<div class="li"><span><b>${s}</b><small>${f}</small></span><button class="end chip" onclick="S.plate={slot:'${s}',items:[['dal',1,'fair'],['roti',2,'sure']],src:'edit',text:'${f.toLowerCase()} (${d[0]})',q:null};go('plate')">${I('pencil',14)}</button></div>`).join('')}</div><button class="btn w" style="margin-top:14px" onclick="go('eod')">${I('message-circle')}Fill gaps by talking</button>`}</div></div>`}

function eod(){if(!S.eod.length)S.eod=[EOD[0]];return `<div class="pg" style="background:linear-gradient(180deg,#22152F,#0E0A14);color:#fff;position:relative"><div class="cyber" style="position:absolute;inset:0;opacity:.6"></div><div style="position:relative">${hdr('<span style="color:#fff">Before you sleep</span>')}<div class="pad"><div class="small" style="opacity:.7;margin-bottom:14px">About 30 seconds. Skip any time.</div><div style="display:grid;gap:12px">${S.eod.map(([w,t])=>w==='me'?`<div class="bubble me">${esc(t)}</div>`:w.startsWith('opts')?`<div class="chips">${t.map(o=>`<button class="chip" onclick="eodStep('${o}')">${o}</button>`).join('')}</div>`:`<div style="color:var(--ink)">${say('k',t)}</div>`).join('')}</div>
 ${S.eod.length===1?`<div class="chips" style="margin-top:14px"><button class="chip" onclick="eodStep()">chai biscuit at 5, dinner skip kiya, maggi at 11</button></div>`:''}
 <div class="row" style="margin-top:18px"><input class="field" id="eodin" placeholder="Type what you had" onkeydown="if(event.key==='Enter')eodStep(this.value)"><button class="icb" style="background:var(--yel)" onclick="eodStep($('#eodin').value)">${I('send',18)}</button></div>
 <button class="btn" style="margin-top:16px" onclick="S.eod=[];tab('today',12)">Done for today</button></div></div></div>`}
function eodStep(o){sfx('log');const n=S.eod.length;if(n===1){S.eod.push(['me',o||EOD[1][1]]);render();setTimeout(()=>{S.meals.Snacks={st:'logged',items:[['chai',1,'sure'],['biscuit',2,'sure']]};S.meals.Dinner={st:'skipped',items:[]};S.eod.push(EOD[2],EOD[3]);sfx('tick');render();scrollEnd()},700)}else if(S.eod.at(-1)[0]==='opts'){S.eod.pop();S.eod.push(['me',o],EOD[4],EOD[5]);render();scrollEnd()}else{if(S.eod.at(-1)[0]==='opts2')S.eod.pop();S.eod.push(['me',o||'none'],['k','Saved. Sleep well. Tomorrow starts fresh, no catching up.']);render();scrollEnd()}}

 else if(m==='track'){sheet=false;inner=`${X}<div style="height:150px;position:relative">${C('a_calm',160,'left:50%;margin-left:-80px;bottom:0')}</div><div class="disp" style="font-size:34px;text-align:center">Exam week coming up?</div><p style="text-align:center;margin:8px 0 14px">Mid sems from 9 Nov. Want light tracking for that week? I will ask before switching back.</p><div class="card" style="background:var(--pl);padding:12px">${['One tap meals only','No questions, no nudges','Plan and history kept as they are'].map(x=>`<div class="row small" style="padding:4px 0;font-weight:700">${I('check',16)}${x}</div>`).join('')}</div><div class="two" style="margin-top:16px"><button class="btn w" onclick="S.trackPrompt=false;closeM()">Not now</button><button class="btn w" onclick="S.trackPrompt=false;S.modal=null;sfx('log');render();toast('Light tracking from 9 Nov')">Switch</button></div><p class="small mut" style="text-align:center;margin:10px 0 0">Change any time in Settings</p>`}
 else if(m==='range'){inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:34px">Why a range?</div><button class="icb" onclick="closeM()">${I('x')}</button></div><p>A katori of dal can be 150 to 200 ml, and oil is invisible in a photo. One exact number would be pretend precision.</p><p class="small mut">Every meal you confirm narrows your range.</p><button class="btn" onclick="closeM()">Got it</button>`}
 else if(m==='swap'){const opts=SWAPS[swapEx]||[];inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:30px">${esc(swapEx)} taken? Swap for</div><button class="icb" onclick="closeM()">${I('x')}</button></div><p class="small mut">Same muscles. What is free right now? Pick all that apply</p><div class="chips" style="margin-bottom:12px">${['Dumbbells','Machine','Bodyweight','Bands'].map((x,i)=>`<button class="chip ${i===0?'on':''}" onclick="this.classList.toggle('on');sfx('tick')">${x}</button>`).join('')}</div><div class="list">${opts.map((o,i)=>`<button class="opt" onclick="doSwap(${i})"><span class="rad"></span><span>${o[0]}<small>${o[1]} · ${o[2]}</small></span></button>`).join('')}</div><p class="small mut">Kept under ${esc(swapEx)} in your history, marked as a swap.</p>`}
 else if(m==='endSess'){sheet=false;inner=`${X}<div class="disp" style="font-size:32px">End the session?</div><p>What you finished is saved. Nothing counts as failed.</p><div class="two"><button class="btn w" onclick="closeM()">Keep going</button><button class="btn w" onclick="finishSession()">End and save</button></div>`}
 else if(m==='goalMode'){inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:34px">Goal mode</div><button class="icb" onclick="closeM()">${I('x')}</button></div><p class="small mut">Pick one. Today and Progress change with it.</p><div class="list">${[['event','Event: Kedarkantha trek'],['fat','Lose fat'],['muscle','Build muscle'],['fit','Get fitter'],['eat','Eat better, no counting']].map(([v,l])=>opt(l,'',S.goalMode===v,`S.goalMode='${v}';S.modal=null;sfx('log');render(true)`)).join('')}</div>`}
 else if(m==='life'){inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:34px">Your lifestyle</div><button class="icb" onclick="closeM()">${I('x')}</button></div><p class="small mut">Pick all that apply. Meal times and shortcuts follow it.</p><div class="list">${Object.entries(LIFE).map(([v,l])=>opt(l,'',S.life.includes(v),`lifeT('${v}')`,true)).join('')}</div><button class="btn" style="margin-top:14px" onclick="closeM();toast('Routine updated')">Done</button>`}
 else if(m==='remind'){inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:34px">Reminders</div><button class="icb" onclick="closeM()">${I('x')}</button></div><p class="small mut">Pick one</p><div class="list">${[['meals','At my meal times','From your routine'],['night','Once at night','One check in before sleep'],['none','No reminders','Only widgets and the app']].map(([v,l,s])=>opt(l,s,S.remind===v,`S.remind='${v}';sfx('tick');render()`)).join('')}</div><button class="btn" style="margin-top:14px" onclick="closeM()">Done</button>`}
 else if(m==='quiet'){inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:34px">Quiet hours</div><button class="icb" onclick="closeM()">${I('x')}</button></div><p class="small mut">Pick all that apply</p><div class="list">${['11 pm to 7 am','Class hours','Office meetings','Prayer times','While I train'].map(x=>opt(x,'',S.quiet.includes(x),`dayToggle(()=>S.quiet,'${x}')`,true)).join('')}</div><button class="btn" style="margin-top:14px" onclick="closeM()">Done</button>`}
 else if(m==='diet'){inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:34px">Diet and days</div><button class="icb" onclick="closeM()">${I('x')}</button></div>${dietBlock()}<button class="btn" style="margin-top:16px" onclick="closeM();toast('Kabir will follow your days')">Done</button>`}
 else if(m==='lang'){inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:34px">Language</div><button class="icb" onclick="closeM()">${I('x')}</button></div><p class="small mut">Pick one. Voice logging understands all of them.</p><div class="list">${['English','Hinglish','Hindi'].map(x=>opt(x,'',S.lang===x,`S.lang='${x}';sfx('tick');render()`)).join('')}</div>`}
 else if(m==='busy'){inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:34px">Add a busy period</div><button class="icb" onclick="closeM()">${I('x')}</button></div><div class="lab" style="margin:6px 0 8px">What is it? Pick one</div><div class="chips" id="bt">${[['📚','Exams'],['✈️','Travel'],['🪔','Festival'],['🤒','Unwell'],['🌙','Fasting'],['🏆','Competition']].map(([e,l],i)=>`<button class="chip ${i===0?'on':''}" data-e="${e}" onclick="document.querySelectorAll('#bt .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');sfx('tick')">${e} ${l}</button>`).join('')}</div><div class="lab" style="margin:16px 0 8px">When</div><input class="field" id="bwhen" placeholder="e.g. 20 to 24 Nov"><div class="lab" style="margin:16px 0 8px">During it. Pick one</div><div class="chips" id="bm">${['Light tracking, ask first','Pause, nothing expected','Keep as usual'].map((x,i)=>`<button class="chip ${i===0?'on':''}" onclick="document.querySelectorAll('#bm .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');sfx('tick')">${x}</button>`).join('')}</div><button class="btn g" style="margin-top:18px" onclick="addBusy()">Add</button>`}
 else if(m==='ai'){inner=`<div class="grab"></div><div class="sp"><div class="disp" style="font-size:34px">AI for photos and guides</div><button class="icb" onclick="closeM()">${I('x')}</button></div><p>Now using: <b>${aiMode()}</b></p><p class="small mut">Opened inside Claude, it uses Claude automatically. Anywhere else, paste a free Gemini key from Google AI Studio. The key stays on this phone only. Without one, everything uses demo answers.</p><input class="field" id="gk" placeholder="Paste Gemini API key" value="${esc(gkey())}"><div class="two" style="margin-top:12px"><button class="btn w" onclick="try{localStorage.removeItem('pulse_gkey')}catch(e){};S.modal=null;render();toast('Key removed')">Remove</button><button class="btn g" onclick="try{localStorage.setItem('pulse_gkey',$('#gk').value.trim())}catch(e){};S.modal=null;sfx('success');render();toast('Saved. AI is now '+aiMode())">Save</button></div>`}
 else if(m==='reset'){sheet=false;inner=`${X}<div class="disp" style="font-size:32px">Reset all data?</div><p>Clears logs and settings on this phone. Cannot be undone.</p><div class="two"><button class="btn w" onclick="closeM()">Cancel</button><button class="btn w" onclick="resetAll()">Reset</button></div>`}
 else if(m==='routineDiff'){sheet=false;inner=`${X}<div class="disp" style="font-size:30px">New routine for this week</div><div class="card" style="padding:6px 14px;margin:12px 0">${[['Classes','9 to 5','Exam 10 to 1'],['Gym','6:30 pm','Rest, 2 short walks'],['Dinner','8:30 pm','8:00 pm'],['Tracking','Simple','Light']].map(([a,b,c])=>`<div class="sp" style="padding:8px 0;border-bottom:1.5px dashed #0002"><b style="font-size:14px">${a}</b><span class="small"><s class="mut">${b}</s> → <b>${c}</b></span></div>`).join('')}</div><div class="two"><button class="btn w" onclick="closeM()">Not now</button><button class="btn w" onclick="S.modal=null;S.style='light';sfx('success');back();toast('Routine saved for this week')">Save it</button></div>`}
 else if(m.startsWith('time:')){const [,t,i]=m.split(':');sheet=false;const cur=S.routine[t][i][1];inner=`${X}<div class="lab">${esc(S.routine[t][i][0])}</div><div class="disp" style="font-size:30px;margin:6px 0 12px">Pick a time</div><div class="chips">${['6:30 am','7:30 am','8:30 am','9:30 am','10:30 am','1:00 pm','2:00 pm','5:00 pm','6:30 pm','7:30 pm','8:30 pm','9:30 pm','11:30 pm','12:30 am'].map(x=>`<button class="chip ${cur===x?'on':''}" onclick="S.routine['${t}'][${i}][1]='${x}';S.modal=null;sfx('tick');render()">${x}</button>`).join('')}</div><button class="btn w sm" style="margin-top:14px" onclick="S.routine['${t}'].splice(${i},1);S.modal=null;sfx('undo');render()">Remove this item</button>`}
 else if(m.startsWith('cell:')){const [,d,j]=m.split(':');sheet=false;inner=`${X}<div class="lab">${d} · ${['Breakfast','Lunch','Snacks','Dinner'][j]}</div><textarea class="field" id="cellv" rows="2" style="margin:10px 0">${esc(S.week[d][j])}</textarea><div class="two"><button class="btn w" onclick="closeM()">Cancel</button><button class="btn g" onclick="S.week['${d}'][${j}]=$('#cellv').value;delete S.unsure['${d}-${j}'];S.modal=null;sfx('log');render()">Save</button></div>`}
 return sheet?`<div class="shade" onclick="if(event.target===this)closeM()"><div class="sheet">${inner}</div></div>`:`<div class="shade center" onclick="if(event.target===this)closeM()"><div class="dlg">${inner}</div></div>`}
function lifeT(v){if(!Array.isArray(S.life))S.life=[S.life];const i=S.life.indexOf(v);if(i>=0){if(S.life.length>1)S.life.splice(i,1)}else S.life.push(v);sfx('tick');render()}
function addBusy(){const e=document.querySelector('#bt .on'),md=document.querySelector('#bm .on');S.busy.push([e.dataset.e,e.textContent.slice(2).trim(),$('#bwhen').value||'Dates to pick',md.textContent]);S.modal=null;sfx('log');render();toast('Busy period added')}
function doSwap(i){const o=SWAPS[swapEx][i];if(S.session){const e=S.session.ex.find(x=>x.n===swapEx);if(e){e.swap=o;e.sets=+o[1][0]}}S.modal=null;sfx('log');render();toast(`Swapped to ${o[0]}. History stays linked`)}

/* ---------- side panels ---------- */
const NAV=[['Start',[['welcome','Welcome'],['ob','Setup, 10 steps'],['tour','App tour'],['launcher','Phone home screen']]],['Today and logging',[['today','Today'],['sheetAdd','Add sheet'],['camera','Camera'],['speak','Speak'],['typeP','Type or search'],['plate','Plate review'],['eod','Night recap']]],['Regular menu',[['menuStart','Your menus'],['menuGrid','Week grid'],['menuLog','Log from menu']]],['Food with Kabir',[['food','Food tab'],['kabir','Kabir panel'],['course','Course'],['lesson','Lesson'],['askK','Ask Kabir'],['gaps','Likely low'],['budget','Within budget'],['katori','Your katori'],['cook','Tell who cooks'],['diary','Diary']]],['Train with Arjun',[['train','Train tab'],['exercise','Exercise guide'],['live','Live set'],['done','Session done'],['askA','Ask Arjun']]],['Progress and settings',[['progress','Progress'],['report','Weekly report'],['profile','Profile and settings'],['describe','Describe a change']]]];
const NOTES={welcome:'Both guides introduced as equals.',ob:'Step 1 is visuals: vivid or calm. Pick one uses round buttons, pick all uses square boxes. Weekdays and weekends have separate routines. Non veg days can be set per weekday.',today:'Done, left, next first. Calories as a range with how sure we are. Above range shows amber with a reason, never red. Kabir and Arjun sit top right.',sheetAdd:'One sheet for every way of logging.',camera:'Shutter opens the real phone camera. AI reads the photo when available, else demo. Label and barcode are one Packet mode.',speak:'Hold to talk. Uses real speech recognition on phones.',typeP:'Plain words or search.',plate:'Same review for every method.',eod:'Gaps filled by talking.',menuStart:'Mess, canteen, tiffin or home plan.',menuGrid:'Photo becomes a week. Unsure cells marked.',menuLog:'Everything ticked by default.',food:'Kabir lives here.',kabir:'Had vs need, and what to eat to complete today.',course:'Units, suggested lesson, review any time.',lesson:'Swipe cards. Slide to add Try today.',askK:'Real AI answers when available.',gaps:'Likely low, never a diagnosis.',budget:'Slider sets the budget.',katori:'Real photo sets your sizes.',cook:'Opens WhatsApp with the message.',diary:'Edit any past day.',train:'Dark training panel. Tap an exercise for the guide. Slide to start.',exercise:'Animated form loop, steps, cues and mistakes.',live:'Rest timer with beep. Leave it running and tap Arjun to come back.',done:'Planned against done.',askA:'Share today with your trainer.',progress:'Goal mode changes this screen and Today.',report:'Both guides write the week from your data.',profile:'Every setting works.',describe:'AI shows the change before saving.',launcher:'What the widget and notification would do.'};
function panels(){const cur=S.modal==='sheetAdd'?'sheetAdd':S.page;
 $('#leftPanel').innerHTML=`<div class="sp"><h1>${APP}<span>.</span></h1><button class="icb mobonly" style="display:none" onclick="$('#mob').innerHTML=''">${I('x')}</button></div><div class="sub">Clickable prototype, DEC 301. AI: ${aiMode()}.</div><div class="ctrl"><button onclick="SOUND=!SOUND;sfx('tick');render()">${I(SOUND?'volume-2':'volume-x',16)}${SOUND?'Sound on':'Sound off'}</button><button onclick="modal('reset')">${I('refresh-cw',16)}Reset</button></div>${NAV.map(([g,items])=>`<div class="grp">${g}</div>${items.map(([p,l])=>`<button class="nav ${cur===p?'on':''}" onclick="jump('${p}')">${l}</button>`).join('')}`).join('')}`;
 const w=S.watch,t=dayTotals();
 $('#rightPanel').innerHTML=`<div class="grp" style="margin-top:0">Wear OS watch · tap it</div><div class="watch" onclick="watchTap()">${w===0?`<div><div style="font-size:42px;font-weight:300">1:05</div><div style="font-size:11px;opacity:.7">Mon 2 Nov</div><div style="margin-top:8px;background:#ffffff1a;border-radius:12px;padding:6px 10px"><b style="font-size:13px">${Math.max(0,S.ptarget-t.p)} g protein left</b><div style="font-size:10px;color:#9ef0b8">Tap to log a meal</div></div></div>`:w===1?`<div><div style="width:46px;height:46px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto">${I('mic',22)}</div><div style="font-size:13px;margin-top:10px;font-weight:700">"Chai aur do biscuit"</div><div style="font-size:10px;opacity:.7;margin-top:4px">Tap to save</div></div>`:`<div>${I('circle-check',38,'color:#9ef0b8')}<div style="font-weight:800;margin-top:6px">Snack logged</div><div style="font-size:10px;opacity:.7">Review later on phone</div></div>`}</div>
 <div class="note"><b>This screen.</b> ${NOTES[cur]||'Part of the flow.'}</div><div class="note"><b>Try this.</b> Today → slide Ate this → Undo → Ate something different → untick bhindi → Review and log. Then tap Arjun → Slide to start → Done with this set.</div>`}
function watchTap(){S.watch=(S.watch+1)%3;sfx(S.watch===1?'rec':'tick');if(S.watch===2){S.meals.Snacks={st:'logged',items:[['chai',1,'sure'],['biscuit',2,'sure']]};sfx('log')}render()}
function jump(p){$('#mob').innerHTML='';S.modal=null;S.fan=false;$('#tour').innerHTML='';
 if(p==='tour'){startTour();return}
 if(p==='sheetAdd'){if(!MAIN.includes(S.page))S.page='today';render(true);openAdd();return}
 if(p==='plate'&&!S.plate)S.plate={slot:'Lunch',items:[['rajma',1,'fair'],['rice',1,'fair'],['roti',2,'sure'],['salad',1,'rough']],src:'photo',text:'Rajma, jeera rice, 2 roti and some salad',q:{t:'Was there ghee on the roti?',o:['Yes','No','Not sure']}};
 if(p==='live'){S.page='train';S.hist=[];startSession();return}
 if(p==='done')S.session=null;if(p==='ob')S.ob.step=0;if(p==='lesson')S.lesson=0;if(p==='camera')S.photo=null;
 S.hist=MAIN.includes(p)||p==='welcome'?[]:['today'];S.page=p;sfx('page');render(true)}
function resetAll(){const snd=SOUND;try{localStorage.removeItem('pulse_v1')}catch(e){}S=fresh();SOUND=snd;document.body.classList.remove('calm');sfx('undo');render(true)}
function mobMenu(){const m=$('#mob');if(m.innerHTML){m.innerHTML='';return}m.innerHTML=`<div class="mobmenu"><div class="side">${$('#leftPanel').innerHTML.replace('class="icb mobonly" style="display:none"','class="icb"')}</div></div>`}

/* ---------- render ---------- */
const PAGES={welcome,ob,today,food,train,progress,camera,speak,typeP,plate,menuStart,reading,menuGrid,menuLog,kabir,course,lesson,askK,askA,gaps,budget,katori,cook,diary,eod,exercise,live,done,report,profile,describe,launcher};
function renderTabs(){if(!MAIN.includes(S.page)||S.modal==='sheetAdd'&&false){$('#tabs').innerHTML='';return}const dark=S.page==='train';
 $('#tabs').innerHTML=`${S.fan?`<div class="fanshade" onclick="toggleFan()"></div><div class="fan">${[['camera','Photo','var(--yel)',"S.fan=false;addSlot=defaultSlot();go('camera',{camMode:'plate',photo:null})"],['mic','Speak','var(--mint)',"S.fan=false;addSlot=defaultSlot();go('speak')"],['plus','More','#fff',"S.fan=false;openAdd()"]].map(([ic,l,bg,fn],i)=>`<button style="background:${bg};animation-delay:${i*.05}s" onclick="${fn}">${I(ic,24)}<span>${l}</span></button>`).join('')}</div>`:''}
 <nav class="tabs ${dark?'dark':''}" id="tabsBar">${[['today','house','Today'],['food','utensils','Food'],['add'],['train','dumbbell','Train'],['progress','chart-column','Progress']].map(([p,ic,l],i)=>p==='add'?`<button class="add ${S.fan?'open':''}" id="tabAdd" onclick="toggleFan()" aria-label="Add food">${I('plus',30)}</button>`:`<button class="${S.page===p?'on':''}" onclick="tab('${p}',${[12,30,0,70,88][i]})">${I(ic,22)}${l}</button>`).join('')}</nav>`}
function render(anim){const vp=$('#vp'),key=S.page+'|'+(S.page==='ob'?S.ob.step:'')+(S.page==='lesson'?S.lesson:''),same=lastKey===key,keep=vp.scrollTop;
 vp.innerHTML=`<div class="${anim&&!same?(MAIN.includes(S.page)?'enterf':dir>0?'enter':'enterb'):''}">${PAGES[S.page]()}</div>`;
 $('#status').className='status'+(['camera','launcher','speak','eod','reading','train','live','exercise','askA','report','kabir','welcome'].includes(S.page)||(S.page==='ob'&&S.ob.step===8)?' light':'');
 if(!same)vp.scrollTop=0;else vp.scrollTop=keep;lastKey=key;
 renderTabs();$('#ov').innerHTML=modalHTML();renderToast();panels();wireSliders();
 if(!same)countUp();else document.querySelectorAll('[data-n]').forEach(el=>el.textContent=fmt(+el.dataset.n));
 const nd=$('#needle');if(nd){const t=dayTotals(),f=Math.min(1,((t.lo+t.hi)/2)/((S.target[0]+S.target[1])/2));if(same)nd.style.transition='none',nd.style.transform=`rotate(${-90+180*f}deg)`;else requestAnimationFrame(()=>requestAnimationFrame(()=>nd.style.transform=`rotate(${-90+180*f}deg)`))}
 save()}
document.addEventListener('pointerdown',()=>ac(),{once:true});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const o=b.getAttribute('onclick')||'';if(!/sfx|go\(|tab\(|modal\(|closeM|back\(|logMeal|ateThis|demoSnap|pickPhoto|obNext|obBack|obOpt|launch|ask\(|setDone|Usual|answer|qty|mq\(|jump|doSwap|finish|eodStep|watchTap|resetAll|openAdd|startSession|swapFor|toggleFan|setVisual|setUnits|dayToggle|avoidT|lessonMove|addBusy|writeReport/.test(o))sfx('tap')},true);
const st=document.createElement('style');st.textContent='@keyframes grow{from{transform:scaleY(0)}}';document.head.appendChild(st);
if(S.visual==='calm')document.body.classList.add('calm');
(function(){const g=new URLSearchParams(location.search).get('go');if(g){S.hist=[];addSlot=defaultSlot();if(g==='camera'){S.page='camera';S.camMode='plate';S.hist=['today']}else if(g==='speak'){S.page='speak';S.hist=['today']}else if(g==='menu'){S.page='menuLog';S.hist=['today']}else if(PAGES[g])S.page=g}})();
render(true);
sampleP.then(()=>{if(claudeSample)panels()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
